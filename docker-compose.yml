version: '3.8'

services:
  # ============================================================================
  # 1. In-House PostgreSQL (Spun up conditionally if DB_LOCATION=in_house)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: talentos-postgres
    restart: unless-stopped
    profiles:
      - in_house
    environment:
      POSTGRES_USER: ${DB_USER:-talentos_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-talentos_secure_password_2026}
      POSTGRES_DB: ${DB_NAME:-talentos_crm}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - talentos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-talentos_admin} -d ${DB_NAME:-talentos_crm}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Python Resume & Email Parser Microservice
  # ============================================================================
  resume-parser:
    build:
      context: ./talentos-resume-parser
      dockerfile: Dockerfile
    container_name: talentos-resume-parser
    restart: unless-stopped
    ports:
      - "${PARSER_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${NODE_ENV:-development}
      - LOG_LEVEL=info
      - CORS_ORIGINS=${PARSER_CORS_ORIGINS:-http://localhost:3000,http://localhost:5001}
    networks:
      - talentos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # 3. Node.js + TypeScript Backend (API, Prisma ORM, Nodemailer SMTP)
  # ============================================================================
  backend:
    build:
      context: ./talentos-backend
      dockerfile: Dockerfile
    container_name: talentos-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=5000
      - DB_LOCATION=${DB_LOCATION:-in_house}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-talentos_admin}
      - DB_PASSWORD=${DB_PASSWORD:-talentos_secure_password_2026}
      - DB_NAME=${DB_NAME:-talentos_crm}
      - DATABASE_URL=postgresql://${DB_USER:-talentos_admin}:${DB_PASSWORD:-talentos_secure_password_2026}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-talentos_crm}
      - EXTERNAL_DATABASE_URL=${EXTERNAL_DATABASE_URL}
      - EXTERNAL_DB_HOST=${EXTERNAL_DB_HOST}
      - EXTERNAL_DB_PORT=${EXTERNAL_DB_PORT}
      - EXTERNAL_DB_USER=${EXTERNAL_DB_USER}
      - EXTERNAL_DB_PASSWORD=${EXTERNAL_DB_PASSWORD}
      - EXTERNAL_DB_NAME=${EXTERNAL_DB_NAME}
      - EXTERNAL_DB_SSL=${EXTERNAL_DB_SSL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-7d}
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - ALLOW_DEMO_DOMAIN_JOIN=${ALLOW_DEMO_DOMAIN_JOIN:-false}
      - RESUME_PARSER_SERVICE_URL=http://resume-parser:8000
      - CV_STORAGE_PROVIDER=${CV_STORAGE_PROVIDER:-local}
      - CV_LOCAL_DIR=${CV_LOCAL_DIR:-/app/uploads/cv}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AWS_S3_REGION=${AWS_S3_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_ACCESS_KEY_ID=${AWS_S3_ACCESS_KEY_ID:-}
      - AWS_S3_SECRET_ACCESS_KEY=${AWS_S3_SECRET_ACCESS_KEY:-}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT:-}
      - AWS_S3_FORCE_PATH_STYLE=${AWS_S3_FORCE_PATH_STYLE:-}
      - AWS_S3_PREFIX=${AWS_S3_PREFIX:-}
      - CLOUDFLARE_R2_ACCOUNT_ID=${CLOUDFLARE_R2_ACCOUNT_ID:-}
      - CLOUDFLARE_R2_BUCKET=${CLOUDFLARE_R2_BUCKET:-}
      - CLOUDFLARE_R2_ACCESS_KEY_ID=${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      - CLOUDFLARE_R2_SECRET_ACCESS_KEY=${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
      - CLOUDFLARE_R2_REGION=${CLOUDFLARE_R2_REGION:-auto}
      - CLOUDFLARE_R2_ENDPOINT=${CLOUDFLARE_R2_ENDPOINT:-}
      - CLOUDFLARE_R2_PREFIX=${CLOUDFLARE_R2_PREFIX:-}
    volumes:
      - ./talentos-backend/uploads:/app/uploads
    networks:
      - talentos-network

  # ============================================================================
  # 4. React + Vite Frontend (Web Dashboard & CRM UI)
  # ============================================================================
  frontend:
    build:
      context: ./talentos-frontend
      dockerfile: Dockerfile
    container_name: talentos-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    environment:
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-5001}/api/v1
    depends_on:
      - backend
    networks:
      - talentos-network

networks:
  talentos-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

