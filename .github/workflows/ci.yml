name: TalentOS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend Typecheck & Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: talentos-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: talentos-backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema & generate client
        run: |
          npx prisma validate
          npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talentos_ci
      - name: Typecheck TypeScript
        run: npx tsc --noEmit
      - name: Run unit & security test suite
        run: npm test

  frontend:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: talentos-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: talentos-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck & build production bundle
        run: npm run build

  resume-parser:
    name: Resume Parser NLP Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: talentos-resume-parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run extractor tests
        run: python tests/test_parser.py

