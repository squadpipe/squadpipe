name: TalentOS CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: Backend Typecheck & Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: talentos-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: talentos-backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema & generate client
        run: |
          npx prisma validate
          npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talentos_ci
      - name: Typecheck TypeScript
        run: npx tsc --noEmit
      - name: Run unit & security test suite
        run: npm test

  frontend:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: talentos-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: talentos-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck & build production bundle
        run: npm run build

  resume-parser:
    name: Resume Parser NLP Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: talentos-resume-parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run extractor tests
        run: python tests/test_parser.py

  deploy:
    name: Deploy Demo to AWS EC2
    needs: [backend, frontend, resume-parser]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync repository to EC2
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "sudo chown -R \$(whoami):\$(whoami) ~/talentos"
          rsync -rlDz --omit-dir-times --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='talentos-backend/uploads' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/talentos/"

      - name: Build, restart containers & run migrations on EC2
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
            set -e
            cd ~/talentos
            docker compose -f docker-compose.yml --profile in_house up -d --build
            docker compose -f docker-compose.yml exec -T backend npx prisma migrate resolve --rolled-back 20261115023800_make_requirement_status_dynamic || true
            docker compose -f docker-compose.yml exec -T backend npx prisma migrate deploy
          EOF

