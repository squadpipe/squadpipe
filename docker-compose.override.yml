# Development overrides for live code reloading
version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev -- --host 0.0.0.0 --port 80

  resume-parser:
    volumes:
      - ./resume-parser/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

